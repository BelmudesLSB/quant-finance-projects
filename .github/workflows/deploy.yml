name: Daily portfolio rebalance

on:
  workflow_dispatch:

permissions:
  contents: write        # ← allows the bot to push commits

jobs:
  rebalance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: 03_lstm_trading_live
        run: pip install -r requirements.txt

      - name: Run deploy.py
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        working-directory: 03_lstm_trading_live
        run: python deploy.py

      - name: Commit updated log
        working-directory: 03_lstm_trading_live
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/daily_log.csv
          git commit -m "log: ${{ github.run_id }}" || echo "nothing to commit"
          git push

      - name: Upload daily log
        uses: actions/upload-artifact@v4
        with:
          name: daily-log-${{ github.run_id }}
          path: 03_lstm_trading_live/logs/daily_log.csv
