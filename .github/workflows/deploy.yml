name: Daily portfolio rebalance

on:
  schedule:
    # 19:55 UTC = 15:55 ET (EDT, UTC-4) — runs Mon-Fri
    # Note: change to 20:55 UTC in winter (EST, UTC-5)
    - cron: "55 19 * * 1-5"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  rebalance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: 03_lstm_trading_live
        run: pip install -r requirements.txt

      - name: Run deploy.py
        working-directory: 03_lstm_trading_live
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python deploy.py

      - name: Commit updated log
        working-directory: 03_lstm_trading_live
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/daily_log.csv
          git commit -m "log: ${{ github.run_id }}" || echo "nothing to commit"
          git push
